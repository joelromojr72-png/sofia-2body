# Mantenimiento de Carros — Cloudflare Worker + R2
# La app (public/) la sirve Cloudflare; la API (/api/*) guarda los datos en R2.

name = "mantenimiento-carros"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# El bucket de R2 donde viven los datos (un solo archivo: datos.json).
# Créalo una vez con:  npx wrangler r2 bucket create mantenimiento-carros
[[r2_buckets]]
binding = "DATOS"
bucket_name = "mantenimiento-carros"

# El PIN para entrar NO va aquí. Se guarda como secreto:
#   npx wrangler secret put APP_PIN
